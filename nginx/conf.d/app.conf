server {
    listen 80;
    server_name osk-warehouse.ru www.osk-warehouse.ru;  # Both domains
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name osk-warehouse.ru www.osk-warehouse.ru;

    ssl_certificate /etc/letsencrypt/live/osk-warehouse.ru-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osk-warehouse.ru-0001/privkey.pem;
    
    # Include SSL configuration
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
